<title>Jeppe Witt</title>
<meta name="description" content="Jeppe Witt" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Manrope:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#F7F4EF; --card:#FFFFFF;
    --primary:#D97757;
    --ink:#1A0F0A; --ink3:#9C7B6E;
    --border:#E8E0D8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Manrope',system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100dvh; display:grid; place-items:center;
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .card {
    background:var(--card); border:1px solid var(--border);
    border-radius:20px; box-shadow:0 4px 24px rgba(26,15,10,.07);
    padding:44px 40px; text-align:center;
    width:100%; max-width:400px;
  }
  .rule { width:34px; height:3px; border-radius:2px; background:var(--primary); margin:0 auto 22px; }
  h1 {
    font-family:'Fraunces',Georgia,serif; font-weight:700;
    font-size:clamp(30px,7vw,38px); letter-spacing:-.02em; line-height:1.15;
    margin-bottom:28px;
  }
  .links { display:flex; align-items:center; justify-content:center; gap:10px; }
  .links a {
    display:inline-flex; align-items:center; gap:7px;
    font-size:14px; font-weight:600; text-decoration:none;
    color:var(--ink); background:var(--bg);
    border:1px solid var(--border); border-radius:999px;
    padding:9px 16px;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .links a:hover, .links a:focus-visible {
    background:var(--primary); border-color:var(--primary); color:#fff; outline:none;
  }
  .links a:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
  .links svg { width:16px; height:16px; fill:currentColor; flex:none; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
